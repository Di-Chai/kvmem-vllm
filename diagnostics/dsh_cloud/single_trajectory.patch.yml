# Shared by capture and real single-trajectory DSH validation.
# Keep the main agent's shell/file/editor tools. Never edit installed bundles.
- id: session-title-llm
  disabled: true
- id: compaction-basic
  config:
    auto: false
- id: command-compact
  disabled: true
- id: llm-retry
  disabled: true
# No delegated model trajectories or parallel workflow workers.
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-workflow
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-ralph
  disabled: true
# No goal-driven automatic continuation behind the requested task.
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
